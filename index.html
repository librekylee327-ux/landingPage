<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/favicon.png">

<meta name="twitter:title" content="핸드오프">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --page-margin: 60px;   /* 페이지 좌우 마진 */
    --nav-height: 64px;    /* Figma: GNB height (10px padding + 44px content) */
    --hero-radius: 30px;   /* Figma: hero corner radius at rest */
  }
  html { overflow-x: hidden; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #fff;
    color: #111827;
  }

  /* ---- GNB: 스크롤 방향에 따라 JS로 opacity 제어 (위로 스크롤=페이드인, 아래로=페이드아웃) ---- */
  .gnb {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--page-margin);
    background: transparent;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .gnb-logo { display: flex; align-items: center; gap: 8px; }
  .gnb-logo img:first-child { width: 16px; height: 24px; }
  .gnb-logo img:last-child { width: 65px; height: 12px; }
  .gnb-links { display: flex; align-items: center; }
  .gnb-btn {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 30px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.075px;
    text-decoration: none;
    white-space: nowrap;
  }
  .gnb-btn--ghost { color: #6b7280; transition: color 0.15s ease; }
  .gnb-btn--ghost.is-on-dark { color: #fff; }
  .gnb-btn--solid { background: #111827; color: #fff; border: none; }
  .gnb-logo { cursor: pointer; }

  /* ---- 토스트: 리퀴드 글래스 ---- */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(var(--nav-height) + 20px);
    transform: translate(-50%, -16px);
    padding: 14px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: #111827;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- 히어로: 스크롤 진행률에 맞춰 margin/radius가 JS로 애니메이션됨 ---- */
  .scrub-outer {
    position: relative;
    height: calc(600vh + 1400px); /* 144프레임 스크럽(스크롤:재생 1:1.5로 완화) + 오버레이 재생 1200px + 다음 섹션 전 순수 대기 200px */
  }
  .scrub-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    background: #fff;
  }
  .hero-frame {
    position: absolute;
    overflow: hidden;
    background: #000;
    /* inset/border-radius는 JS가 스크롤 진행률에 맞춰 매 프레임 갱신 */
  }
  .hero-frame canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .scrub-loading {
    position: absolute;
    inset: 0;
    background: #e2e2e2;
  }
  .hero-title {
    position: absolute;
    left: 40px;
    bottom: 40px;
    z-index: 5;
    color: #fff;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.3;
  }

  /* ---- 스크럽이 끝나갈 때 영상 위에 겹쳐서 페이드인되는 오버레이 ---- */
  .hero-overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* ---- 히어로 종료 텍스트: 오버레이 재생이 끝나갈 때 JS로 순차 페이드인 ---- */
  .hero-outro {
    position: absolute;
    left: 10.42%;   /* Figma: 150/1440 */
    top: 25.4%;     /* Figma: 220/866 */
    width: 22.92%;  /* Figma: 330/1440 */
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #fff;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }
  .hero-outro-title {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.3;
  }
  .hero-outro-line,
  .hero-outro-desc {
    opacity: 0;
    transform: translateY(20px);
    white-space: nowrap; /* Figma가 의도적으로 나눈 줄바꿈 — 폴백 폰트 폭 차이로 인한 재줄바꿈 방지 */
  }
  .hero-outro-desc {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
  }

  /* 1200px 이하부터는 프레임이 좁아져 큰 폰트가 배경과 겹쳐 보임 — 폰트 축소 + 좌측으로 이동 */
  @media (max-width: 1200px) {
    .hero-outro { left: 5%; width: 34%; gap: 12px; }
    .hero-outro-title { font-size: 24px; gap: 4px; }
    .hero-outro-desc { font-size: 13px; }
  }

  /* ---- 재사용 컨테이너: 페이지 마진 안에서 중앙 정렬 ---- */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 var(--page-margin);
  }

  /* ---- 원초적인 질문 섹션 ---- */
  .qa-section { padding: 160px 0; background: #ffffff; }
  .qa-section .container {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qa-copy { display: flex; flex-direction: column; gap: 20px; max-width: 480px; }
  .qa-eyebrow {
    color: #0158fd;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.35;
    letter-spacing: 0.24px;
  }
  .qa-title {
    color: #111827;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.6px;
  }

  .qa-desc {
    color: #4b5563;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.4px;
  }

  @media (max-width: 1200px) {
    .qa-eyebrow { font-size: 16px; }
    .qa-title { font-size: 24px; }
    .qa-desc { font-size: 13px; }
  }
  .qa-icon {
    width: 356px;
    height: 356px;
    flex-shrink: 0;
  }
  .qa-icon img {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- 푸터: 미니멀 ---- */
  .footer { border-top: 1px solid #e5e7eb; padding: 48px 0; }
  .footer .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .footer-logo { display: flex; align-items: center; gap: 8px; opacity: 0.7; cursor: pointer; }
  .footer-logo img:first-child { width: 14px; height: 21px; }
  .footer-logo img:last-child { width: 57px; height: 10.6px; }
  .footer-copy { color: #9ca3af; font-size: 13px; letter-spacing: 0.2px; }

  /* ---- 모바일 대응 ---- */
  @media (max-width: 768px) {
    :root { --page-margin: 20px; }
    .gnb-btn { padding: 8px 16px; font-size: 13px; }
    .gnb-logo img:first-child { width: 13px; height: 20px; }
    .gnb-logo img:last-child { width: 54px; height: 10px; }
    .hero-title { left: 20px; bottom: 24px; font-size: 24px; }
    /* 스크롤 스크럽 인터랙션 없이 문서 흐름에 놓인 고정 카드(4:3)로만 노출 — JS 인셋 계산 대신 CSS로 처리 */
    .scrub-outer { height: auto; }
    .scrub-sticky { position: static; height: auto; padding: calc(var(--nav-height) + 16px) 10px 40px; background: #fff; }
    .hero-frame { position: relative; inset: auto; width: 100%; aspect-ratio: 4 / 3; border-radius: 30px; }
    .hero-outro { display: none; } /* 모바일은 sticky 스크럽/홀드 구간이 없어 트리거할 스크롤 진행률이 없음 */
    .qa-section { padding: 40px 0; }
    .qa-section .container { flex-direction: column; gap: 0; text-align: center; }
    .qa-copy { align-items: center; max-width: 100%; }
    .qa-icon { display: none; }
    .footer .container { justify-content: center; text-align: center; }
  }

</style>
</head>
<body>

  <nav class="gnb" id="gnb">
    <div class="gnb-logo">
      <img src="assets/nav/bi-icon.svg" alt="">
      <img src="assets/nav/handoff-wordmark.svg" alt="Handoff">
    </div>
    <div class="gnb-links">
      <a href="#" class="gnb-btn gnb-btn--ghost js-gnb-action" data-toast="준비중입니다">About Us</a>
      <a href="#" class="gnb-btn gnb-btn--solid js-gnb-action" data-toast="올해 하반기에 찾아뵐게요">Sign Up</a>
    </div>
  </nav>

  <div class="toast" id="toast">리퀴드글래스 gui로 준비중입니다.</div>

  <section class="scrub-outer" id="scrubOuter">
    <div class="scrub-sticky">
      <div class="hero-frame" id="heroFrame">
        <canvas id="scrubCanvas"></canvas>
        <div class="hero-title" id="heroTitle">드디어 내 말에 움직이고,<br>내 말로 일하는 AI</div>
        <canvas class="hero-overlay" id="heroOverlay"></canvas>
        <div class="hero-outro" id="heroOutro">
          <div class="hero-outro-title">
            <p class="hero-outro-line" data-outro-index="0">더이상 고민하지 말고</p>
            <p class="hero-outro-line" data-outro-index="1">마음대로 시작하세요</p>
          </div>
          <p class="hero-outro-desc" data-outro-index="2">어떻게 하면 잘 알아들을까? 얘 지금 뭐라는 거지?<br>AI를 잘 쓰기 위해 AI를 공부하는 시대와 작별.</p>
        </div>
        <div class="scrub-loading" id="scrubLoading"></div>
      </div>
    </div>
  </section>

  <section class="qa-section">
    <div class="container">
      <div class="qa-copy">
        <p class="qa-eyebrow">원초적인 질문</p>
        <h2 class="qa-title">AI를 쓰는데 왜!<br>내가 다 알아야해!?</h2>
        <p class="qa-desc">시키려면 알아야하고, 모르면 배워야하고, 배우면 배울게 또 있다. 결국 내 지식이 천장이고, 아는만큼 나온다면 그게 무슨 인공지능입니까.</p>
      </div>
      <div class="qa-icon">
        <img src="assets/sections/l-help.png" alt="물음표 아이콘">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logo">
        <img src="assets/nav/bi-icon.svg" alt="">
        <img src="assets/nav/handoff-wordmark.svg" alt="Handoff">
      </div>
      <p class="footer-copy">&copy; 2026 Handoff. All rights reserved.</p>
    </div>
  </footer>

<script>
  const FRAME_COUNT = 144;
  const frameSrc = (i) => `assets/frames/frame_${String(i).padStart(3, '0')}.webp`;
  const OVERLAY_FRAME_COUNT = 54;
  const overlayFrameSrc = (i) => `assets/frames2/frame_${String(i).padStart(3, '0')}.webp`;

  const scrubOuter = document.getElementById('scrubOuter');
  const heroFrame = document.getElementById('heroFrame');
  const gnb = document.getElementById('gnb');
  const heroTitle = document.getElementById('heroTitle');
  const canvas = document.getElementById('scrubCanvas');
  const loadingEl = document.getElementById('scrubLoading');
  const heroOverlay = document.getElementById('heroOverlay');
  const toast = document.getElementById('toast');

  document.querySelectorAll('.gnb-logo, .footer-logo').forEach((el) => {
    el.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  let toastTimer;
  document.querySelectorAll('.js-gnb-action').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      clearTimeout(toastTimer);
      toast.textContent = el.dataset.toast;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    });
  });

  // object-fit: cover와 동일한 계산으로 프레임 시퀀스를 캔버스에 스크럽 재생
  // start()를 호출하기 전까진 요청을 보내지 않음 — 오버레이는 히어로 로딩이 끝난 뒤에만 불러와 초기 로드와 대역폭을 다투지 않게 함
  function createScrubber(canvasEl, count, srcFn) {
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
    const imgs = [];
    let started = false;
    function start(onAllLoaded) {
      if (started) return;
      started = true;
      let loadedCount = 0;
      for (let i = 1; i <= count; i++) {
        const img = new Image();
        img.onload = () => {
          loadedCount++;
          if (i === 1) draw(1); // 첫 프레임 도착하면 바로 보여주기
          if (loadedCount === count && onAllLoaded) onAllLoaded();
        };
        img.src = srcFn(i);
        imgs.push(img);
      }
    }
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvasEl.getBoundingClientRect();
      canvasEl.width = rect.width * dpr;
      canvasEl.height = rect.height * dpr;
    }
    function draw(index) {
      const img = imgs[index - 1];
      if (!img || !img.complete || img.naturalWidth === 0) return;
      const cw = canvasEl.width, ch = canvasEl.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const scale = Math.max(cw / iw, ch / ih);
      const dw = iw * scale, dh = ih * scale;
      const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, dx, dy, dw, dh);
    }
    return { start, resize, draw };
  }

  const MOBILE = window.innerWidth <= 768; // 모바일은 스크롤 스크럽 없이 고정 카드로만 노출
  // MOBILE은 로드 시점에 한 번만 고정되므로, 리사이즈로 768px 경계를 넘으면 재판정하도록 새로고침
  window.matchMedia('(max-width: 768px)').addEventListener('change', () => location.reload());

  const hero = createScrubber(canvas, FRAME_COUNT, frameSrc);
  const overlay = createScrubber(heroOverlay, OVERLAY_FRAME_COUNT, overlayFrameSrc);
  hero.start(() => {
    loadingEl.style.display = 'none';
    if (!MOBILE) overlay.start();
  });

  let current = 0;
  let target = 0;
  let rawCurrent = 0;
  let rawTarget = 0;
  let outroTarget = 0; // 아웃트로 텍스트 트리거용 진행률(0~1)

  const HOLD_PX = 1200; // 마지막 프레임 도달 후 오버레이(frames2)가 재생되는 홀드 스크롤량 (재생 시작점이 늦춰진 만큼 예산을 키워 속도 유지)
  const EXTRA_HOLD_PX = 200; // 오버레이 마지막 프레임 이후 다음 섹션으로 넘어가기 전 순수 대기 스크롤량
  const OUTRO_START = 0.9; // 프레임(frames, 144장) 스크럽이 90% 진행된 지점부터 아웃트로 텍스트 시작

  function getProgress() {
    const rect = scrubOuter.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight - HOLD_PX - EXTRA_HOLD_PX;
    return Math.min(1, Math.max(0, -rect.top / scrollable));
  }

  // HOLD_PX까지 포함한 진행률(EXTRA_HOLD_PX는 제외) — 오버레이가 히어로와 동시에 끝내려고
  // 서두르지 않고 홀드 구간까지 여유롭게 재생된 뒤, EXTRA_HOLD_PX 동안은 마지막 프레임에 멈춰있음
  function getRawProgress() {
    const rect = scrubOuter.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight - EXTRA_HOLD_PX;
    return Math.min(1, Math.max(0, -rect.top / scrollable));
  }

  // 시작점은 frames(target) 90% 지점에 고정, 끝점은 frames와 무관하게 오버레이 홀드가 끝나는
  // 지점(rawProgress=1)으로 늦춰서 스크롤 픽셀 구간으로 직접 정규화
  function getOutroProgress() {
    const rect = scrubOuter.getBoundingClientRect();
    const mainScrollable = rect.height - window.innerHeight - HOLD_PX - EXTRA_HOLD_PX;
    const rawScrollable = rect.height - window.innerHeight - EXTRA_HOLD_PX;
    const scrolled = -rect.top;
    const start = mainScrollable * OUTRO_START;
    const end = rawScrollable;
    return Math.min(1, Math.max(0, (scrolled - start) / (end - start)));
  }

  let lastScrollY = window.scrollY;
  let gnbVisible = true;
  const SCROLL_DIR_THRESHOLD = 4; // 작은 흔들림 무시

  function setGnbVisible(visible) {
    if (gnbVisible === visible) return;
    gnbVisible = visible;
    gnb.style.opacity = visible ? '1' : '0';
    gnb.style.transform = visible ? 'translateY(0)' : 'translateY(-16px)';
    gnb.style.pointerEvents = visible ? 'auto' : 'none';
  }

  function onScroll() {
    target = getProgress();
    rawTarget = getRawProgress();
    outroTarget = getOutroProgress();
    const y = window.scrollY;
    const delta = y - lastScrollY;
    if (y < 10) {
      setGnbVisible(true);
    } else if (delta > 0) {
      setGnbVisible(false); // 아래로 스크롤 = 지연 없이 바로 숨김
    } else if (delta < -SCROLL_DIR_THRESHOLD) {
      setGnbVisible(true); // 위로 스크롤 = 흔들림 무시하고 보임
    }
    lastScrollY = y;
  }

  // 실제 scroll 이벤트는 브라우저가 프레임 단위로 지연시켜 발생시키므로,
  // 최초 반응 속도를 위해 wheel/touch 입력 시점에 미리 방향을 감지해 gnb를 뺀다
  if (!MOBILE) {
    window.addEventListener('wheel', (e) => {
      if (window.scrollY < 10) return;
      if (e.deltaY > 0) setGnbVisible(false);
      else if (e.deltaY < -SCROLL_DIR_THRESHOLD) setGnbVisible(true);
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (window.scrollY < 10) return;
      const dy = touchStartY - e.touches[0].clientY; // 양수 = 아래로 스크롤
      if (dy > 0) setGnbVisible(false);
      else if (dy < -SCROLL_DIR_THRESHOLD) setGnbVisible(true);
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  const NAV_H = 64, NAV_GAP = 16, SIDE = 30, BOTTOM = 60, RADIUS = 30;
  // 마진/라운드는 스크롤 극초반(6%)에서만 빠르게 0으로 스냅 — 그 이후는 프레임 스크럽에만 반응
  const LAYOUT_RANGE = 0.06;
  // 오버레이 영상은 스크롤 마지막 구간(80%~100%)에서 페이드인되며 자체 프레임을 스크럽
  const OVERLAY_START = 0.86;

  function updateLayout(progress) {
    heroOverlay.style.opacity = easeOutCubic(Math.min(1, Math.max(0, (progress - OVERLAY_START) / (1 - OVERLAY_START))));
    const t = easeOutCubic(Math.min(1, progress / LAYOUT_RANGE));
    const top = lerp(NAV_H + NAV_GAP, 0, t);
    const side = lerp(SIDE, 0, t);
    const bottom = lerp(BOTTOM, 0, t);
    const radius = lerp(RADIUS, 0, t);
    heroFrame.style.top = top + 'px';
    heroFrame.style.left = side + 'px';
    heroFrame.style.right = side + 'px';
    heroFrame.style.bottom = bottom + 'px';
    heroFrame.style.borderRadius = radius + 'px';
    heroTitle.style.opacity = 1 - t;
  }

  function overlayFrameIndex() {
    const rect = scrubOuter.getBoundingClientRect();
    const mainScrollable = rect.height - window.innerHeight - HOLD_PX - EXTRA_HOLD_PX;
    const rawScrollable = rect.height - window.innerHeight - EXTRA_HOLD_PX;
    const rawOverlayStart = mainScrollable / rawScrollable; // 히어로가 끝나 opacity가 완전히 1이 되는 시점부터 프레임 재생 시작 (페이드인 중 앞단 소모 방지)
    const t = Math.min(1, Math.max(0, (rawCurrent - rawOverlayStart) / (1 - rawOverlayStart)));
    return Math.min(OVERLAY_FRAME_COUNT, Math.max(1, Math.round(t * (OVERLAY_FRAME_COUNT - 1)) + 1));
  }

  // GNB 텍스트로고/텍스트버튼 뒤에 실제로 그려진 캔버스 픽셀 밝기를 읽어 라이트/다크 컬러를 스위칭
  const wordmarkImg = document.querySelector('.gnb-logo img:last-child');
  const wordmarkSrc = { light: 'assets/nav/handoff-wordmark.svg', dark: 'assets/nav/handoff-wordmark-white.svg' };
  const ghostBtn = document.querySelector('.gnb-btn--ghost');
  const LUM_THRESHOLD = 140;

  function luminanceAt(canvasEl, clientX, clientY) {
    const rect = canvasEl.getBoundingClientRect();
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) {
      return 255; // 프레임 캔버스 바깥(= 흰 배경 위) — 밝음으로 취급
    }
    const dpr = window.devicePixelRatio || 1;
    const x = Math.min(canvasEl.width - 1, Math.round((clientX - rect.left) * dpr));
    const y = Math.min(canvasEl.height - 1, Math.round((clientY - rect.top) * dpr));
    const px = canvasEl.getContext('2d').getImageData(Math.max(0, x), Math.max(0, y), 1, 1).data;
    return 0.2126 * px[0] + 0.7152 * px[1] + 0.0722 * px[2];
  }

  function bgLuminanceAt(clientX, clientY) {
    const overlayVisible = parseFloat(heroOverlay.style.opacity || '0') > 0.5;
    return luminanceAt(overlayVisible ? heroOverlay : canvas, clientX, clientY);
  }

  function updateGnbContrast() {
    const wRect = wordmarkImg.getBoundingClientRect();
    const isDarkForLogo = bgLuminanceAt(wRect.left + wRect.width / 2, wRect.top + wRect.height / 2) < LUM_THRESHOLD;
    const wantSrc = isDarkForLogo ? wordmarkSrc.dark : wordmarkSrc.light;
    if (!wordmarkImg.src.endsWith(wantSrc)) wordmarkImg.src = wantSrc;

    const bRect = ghostBtn.getBoundingClientRect();
    const isDarkForBtn = bgLuminanceAt(bRect.left + bRect.width / 2, bRect.top + bRect.height / 2) < LUM_THRESHOLD;
    ghostBtn.classList.toggle('is-on-dark', isDarkForBtn);
  }

  // 아웃트로 텍스트 3개(타이틀 2줄 + 설명)를 순차 페이드인+상승. linear이므로 opacity == localT —
  // 다음 텍스트는 이전 텍스트 opacity가 60%(=0.6)일 때 시작하도록 STAGGER = DURATION * 0.6
  const OUTRO_DURATION = 0.3; // 0.5의 60%
  const OUTRO_STAGGER = OUTRO_DURATION * 0.6;
  const outroEls = document.querySelectorAll('#heroOutro [data-outro-index]');

  function updateOutro(outroT) {
    outroEls.forEach((el) => {
      const i = Number(el.dataset.outroIndex);
      const localT = Math.min(1, Math.max(0, (outroT - i * OUTRO_STAGGER) / OUTRO_DURATION));
      el.style.opacity = localT;
      el.style.transform = `translateY(${(1 - localT) * 20}px)`;
    });
  }

  function raf() {
    current += (target - current) * 0.15;
    rawCurrent += (rawTarget - rawCurrent) * 0.15;
    updateLayout(target); // hero-frame 크기가 바뀌므로 그리기 전에 캔버스 버퍼도 갱신
    updateOutro(outroTarget);
    hero.resize();
    hero.draw(Math.min(FRAME_COUNT, Math.max(1, Math.round(current * (FRAME_COUNT - 1)) + 1)));
    overlay.resize();
    overlay.draw(overlayFrameIndex());
    updateGnbContrast();
    requestAnimationFrame(raf);
  }

  if (MOBILE) {
    // 스크롤 스크럽 없이, CSS aspect-ratio(4:3)로 문서 흐름에 놓인 고정 카드로만 노출
    window.addEventListener('resize', () => {
      hero.resize();
      hero.draw(1);
    }, { passive: true });
    hero.resize();
    hero.draw(1);
  } else {
    window.addEventListener('resize', () => {
      hero.resize();
      hero.draw(Math.round(current * (FRAME_COUNT - 1)) + 1);
      overlay.resize();
      overlay.draw(overlayFrameIndex());
    }, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });
    hero.resize();
    overlay.resize();
    onScroll();
    updateLayout(target);
    requestAnimationFrame(raf);
  }
</script>

</body>
</html>
