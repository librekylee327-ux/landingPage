<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<!-- 영문 링크 미리보기 전용(/en). 슬랙·링크드인·X는 스크립트를 돌리지 않고 이 태그만 읽는다.
     사람은 바로 본 페이지 영문(/?lang=en)으로 넘어가고, 본 페이지가 주소창을 다시 /en으로 보여 준다.
     문구는 index.html의 한국어 title·description을 옮긴 것. 지금 홈은 영문판이 없어 /?lang=en도 한국어로 열린다 -->
<script>
  var q = location.search ? '&' + location.search.slice(1) : '';
  location.replace('/?lang=en' + q + location.hash);
</script>
<meta name="robots" content="noindex">
